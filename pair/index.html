<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pair Your Oomkik Frame | Oomkik</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta http-equiv="refresh" content="0; url=https://up.oomkik.com/pair">
  <link rel="canonical" href="https://up.oomkik.com/pair">
  <script>
    window.location.replace("https://up.oomkik.com/pair" + window.location.search + window.location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #1e293b;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
    }
    .logo {
      height: 48px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #6366f1;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/oonkik-logo.png" alt="Oomkik Logo" class="logo">
    <h1>Redirecting to Frame Pairing...</h1>
    <p>If you are not redirected automatically, click the button below to continue.</p>
    <a href="https://up.oomkik.com/pair" class="btn">Continue to Pair Device</a>
  </div>
</body>
</html>
